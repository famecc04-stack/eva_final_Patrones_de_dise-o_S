    <rect width="440" height="600" rx="20" fill="#ffffff" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.35))"/>
    
    <!-- CARD HEADER -->
    <path d="M 0 20 Q 0 0 20 0 L 420 0 Q 440 0 440 20 L 440 120 L 0 120 Z" fill="#0f172a"/>
    <g transform="translate(195, 25)">
      <rect width="50" height="50" rx="12" fill="#2563eb"/>
      <text x="25" y="32" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="bold">TS</text>
    </g>
    <text x="220" y="95" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="bold">TechSolutions S.A.</text>
    <text x="220" y="112" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Inter, sans-serif" font-size="11">Plataforma de Gestión Empresarial PYME</text>

    <!-- FORM BODY -->
    <!-- Role selector RBAC -->
    <text x="40" y="160" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="bold">SELECCIONAR ROL PARA SIMULACIÓN (RBAC):</text>
    <rect x="40" y="172" width="360" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="56" y="198" fill="#1e293b" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="bold">Gerente General (Acceso Total &amp; Alertas)</text>

    <!-- Email -->
    <text x="40" y="245" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="bold">CORREO ELECTRÓNICO / USUARIO:</text>
    <rect x="40" y="257" width="360" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="56" y="283" fill="#334155" font-family="Segoe UI, Inter, sans-serif" font-size="12">gerencia@techsolutions.pe</text>

    <!-- Password -->
    <text x="40" y="330" fill="#475569" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="bold">CONTRASEÑA:</text>
    <rect x="40" y="342" width="360" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="56" y="368" fill="#334155" font-family="Segoe UI, Inter, sans-serif" font-size="14">••••••••••••••••</text>

