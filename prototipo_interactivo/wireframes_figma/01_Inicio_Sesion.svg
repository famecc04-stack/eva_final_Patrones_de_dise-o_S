    <text x="220" y="448" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold">Iniciar Sesión en el Sistema →</text>

    <!-- Card Footer -->
    <line x1="40" y1="500" x2="400" y2="500" stroke="#f1f5f9"/>
    <text x="220" y="530" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Inter, sans-serif" font-size="11">Zegel 2026 – Curso: Patrones de Diseño de Software</text>
    <text x="220" y="550" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="10">Integrantes: Orellana del Castillo &amp; Cadillo Córdova</text>
